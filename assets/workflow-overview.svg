<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">项目管理 Skills 工作流总览</title>
  <desc id="desc">从轻量 PRD 到近期计划、效果图与 Figma、核心链路实现、演示验收；开源选型和项目体检按需加入。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b30"/><stop offset="1" stop-color="#192943"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#70e3cb"/><stop offset="1" stop-color="#9aabff"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#7588a9" stroke-width="1.5"/></marker>
    <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.label{fill:#f0f5ff;font-size:22px;font-weight:700}.body{fill:#b0bfd6;font-size:16px}.tag{fill:#70e3cb;font-size:14px;letter-spacing:2px}.card{fill:#1e304b;stroke:#3b506f;stroke-width:1}</style>
  </defs>
  <rect width="1200" height="660" rx="24" fill="url(#bg)"/>
  <circle cx="1130" cy="55" r="190" fill="#9aabff" opacity=".035"/>
  <text x="54" y="62" class="tag">7 个技能 · 中文协作 · 按需选用</text>
  <text x="54" y="124" fill="#f0f5ff" font-size="42" font-weight="700">从一个想法，到一条真正跑通的核心链路</text>
  <text x="54" y="164" class="body" font-size="19">先做北极星 Demo，再根据真实结果迭代。</text>
  <rect x="54" y="200" width="1092" height="3" rx="1.5" fill="url(#accent)"/>
  <g>
    <rect x="54" y="242" width="194" height="174" rx="16" class="card"/>
    <text x="74" y="274" class="tag">01 / 需求</text><text x="74" y="315" class="label">轻量 PRD</text>
    <text x="74" y="351" class="body">用户 · 场景 · 成功标准</text><text x="74" y="379" class="body">明确真实与模拟边界</text>
    <rect x="278" y="242" width="194" height="174" rx="16" class="card"/>
    <text x="298" y="274" class="tag">02 / 规划</text><text x="298" y="315" class="label">近期小目标</text>
    <text x="298" y="351" class="body">依赖 · 状态 · 验收</text><text x="298" y="379" class="body">知道当前与下一步</text>
    <rect x="502" y="242" width="194" height="174" rx="16" class="card"/>
    <text x="522" y="274" class="tag">03 / 设计</text><text x="522" y="315" class="label">Figma 原型</text>
    <text x="522" y="351" class="body">效果图先定视觉方向</text><text x="522" y="379" class="body">Figma 作为界面依据</text>
    <rect x="726" y="242" width="194" height="174" rx="16" class="card"/>
    <text x="746" y="274" class="tag">04 / 实施</text><text x="746" y="315" class="label">小步开发</text>
    <text x="746" y="351" class="body">改动 · 验证 · 工作日志</text><text x="746" y="379" class="body">真实打通核心能力</text>
    <rect x="950" y="242" width="194" height="174" rx="16" class="card"/>
    <text x="970" y="274" class="tag">05 / 收尾</text><text x="970" y="315" class="label">演示验收</text>
    <text x="970" y="351" class="body">证据 · 反馈 · 已知限制</text><text x="970" y="379" class="body">据此决定下一轮</text>
  </g>
  <g stroke="#7588a9" stroke-width="2" marker-end="url(#arrow)"><path d="M252 329h17"/><path d="M476 329h17"/><path d="M700 329h17"/><path d="M924 329h17"/></g>
  <path d="M1047 425v30H151v-30" fill="none" stroke="#7588a9" stroke-width="1.5" stroke-dasharray="6 7" marker-end="url(#arrow)"/>
  <rect x="449" y="440" width="302" height="30" rx="15" fill="#16243b"/>
  <text x="600" y="461" text-anchor="middle" class="body">持续迭代 · 只更新受影响的内容</text>
  <rect x="54" y="504" width="530" height="94" rx="14" fill="#15243a" stroke="#30455f"/>
  <text x="76" y="540" class="label" font-size="20">按需加入：开源方案调研</text>
  <text x="76" y="574" class="body">找到参考与复用边界，核对来源、许可及适配成本</text>
  <rect x="614" y="504" width="530" height="94" rx="14" fill="#15243a" stroke="#30455f"/>
  <text x="636" y="540" class="label" font-size="20">已有项目：先做项目体检</text>
  <text x="636" y="574" class="body">区分已证实问题、待验证风险与可选优化</text>
  <text x="54" y="634" fill="#7f93af" font-size="14">流程示意 · 各技能可独立使用 · Demo 验收不等于正式可用</text>
</svg>
